<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>소리 시험대 — 씨앗 아틀리에 2150</title>
    <style>
      :root {
        --bg: #0c1413;
        --panel: #13201e;
        --line: #24403b;
        --ink: #e6efe9;
        --dim: #8fa89f;
        --chip: #3fd0c0;
        --mult: #e0569b;
        --gold: #d9b45a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #17302b 0%, var(--bg) 60%);
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        min-height: 100vh;
      }
      main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
      h2 { font-size: 15px; margin: 0 0 10px; color: var(--gold); font-weight: 600; }
      p.lead { margin: 0 0 18px; color: var(--dim); }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px 16px;
        margin-bottom: 14px;
      }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
      button {
        font: inherit;
        color: var(--ink);
        background: #1b2e2a;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        text-align: left;
      }
      button:hover { border-color: var(--chip); }
      button:active { transform: translateY(1px); }
      button.on { background: #22453f; border-color: var(--chip); }
      button.big { background: #1f3b36; border-color: var(--chip); font-weight: 600; }
      button small { display: block; color: var(--dim); font-size: 12px; }
      label { display: flex; gap: 8px; align-items: center; color: var(--dim); }
      input[type='range'] { width: 180px; accent-color: var(--chip); }
      .val { min-width: 36px; color: var(--ink); font-variant-numeric: tabular-nums; }
      .status { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }
      .ok { color: var(--chip); }
      .bad { color: #ff7a7a; }
      pre {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        background: #0a1110;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
        color: var(--dim);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/audio-test.ts"></script>
  </body>
</html>
