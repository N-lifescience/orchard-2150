<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>그림 갤러리 · 오차드 2150</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #020d0b;
        color: #f3ead6;
        font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
      #app { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 32px 24px 120px; }
      .g-head { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 0 8px; }
      .g-controls {
        position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
        padding: 10px 14px; margin: 8px auto 20px; border-radius: 14px; width: fit-content; max-width: 100%;
        background: rgba(4, 18, 16, 0.72); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px rgba(230, 199, 122, 0.35);
      }
      .g-controls button, .g-controls label {
        font: 600 13px/1 'Pretendard Variable', sans-serif; color: #f3ead6; background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(230, 199, 122, 0.35); border-radius: 999px; padding: 7px 12px; cursor: pointer;
      }
      .g-controls button.is-on { background: #e6c77a; color: #1b1f1d; }
      .g-controls input[type='range'] { vertical-align: middle; accent-color: #e6c77a; }
      section { margin: 40px 0; }
      h2 {
        font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 22px; color: #e6c77a; margin: 0 0 6px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      .g-note { margin: 0 0 16px; font-size: 13px; color: rgba(243, 234, 214, 0.7); }
      .g-row { display: flex; flex-wrap: wrap; gap: 26px 20px; align-items: flex-end; }
      .g-cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .g-cap { font-size: 11.5px; line-height: 1.35; color: rgba(243, 234, 214, 0.78); text-align: center; max-width: 170px; }
      .g-panel { background: rgba(243, 234, 214, 0.06); border-radius: 12px; padding: 10px; box-shadow: inset 0 0 0 1px rgba(230, 199, 122, 0.18); }
      .g-panel.is-ivory { background: #f3ead6; }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <main id="app"></main>
    <script type="module" src="./src/gallery.ts"></script>
  </body>
</html>
